<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botanical Plate Generator — 植物図鑑画像ジェネレータ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <div>
          <h1 class="brand-title">Botanical Plate Generator</h1>
          <p class="brand-subtitle">植物図鑑プレート画像ジェネレータ（4:5 高解像度出力）</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="resetButton" class="btn btn-ghost" title="入力内容を初期サンプルに戻す">
          サンプルに戻す
        </button>
      </div>
    </header>

    <!-- メインコンテンツ（左: 設定パネル / 右: プレビュー） -->
    <main class="workspace">
      <!-- 入力・設定パネル -->
      <section class="editor-panel" aria-label="図鑑データの入力">
        <!-- 1. 画像アップロード -->
        <div class="form-section">
          <h2 class="section-heading">1. 写真のアップロード</h2>
          <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="画像を選択またはドラッグ＆ドロップ">
            <input
              type="file"
              id="imageInput"
              accept="image/*"
              class="sr-only"
            >
            <div class="drop-zone-content">
              <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="17 8 12 3 7 8" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="12" y1="3" x2="12" y2="15" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <p class="drop-zone-primary" id="fileStatusText">クリックして画像を選択、またはドラッグ＆ドロップ</p>
              <p class="drop-zone-hint">JPEG / PNG / WebP 対応・プレビュー上でドラッグして構図を調整可能</p>
            </div>
          </div>

          <!-- 写真のズーム・位置調整（画像読み込み後に有効化） -->
          <div id="imageControls" class="image-controls" hidden>
            <div class="control-row">
              <label for="zoomSlider" class="control-label">拡大率</label>
              <input type="range" id="zoomSlider" min="1" max="3" step="0.01" value="1">
              <span id="zoomValue" class="control-value">100%</span>
            </div>
            <div class="control-actions">
              <span class="control-hint">※ 右のプレビュー画像をドラッグすると位置を微調整できます</span>
              <button type="button" id="resetCropButton" class="btn btn-text">位置をリセット</button>
            </div>
          </div>
        </div>

        <!-- 2. テキスト入力（5項目） -->
        <div class="form-section">
          <h2 class="section-heading">2. 図鑑テキスト</h2>

          <div class="field">
            <label for="taxonomyInput" class="field-label">
              分類（科・亜科・族・亜族）
              <span class="field-note">左上に縦配置</span>
            </label>
            <input
              type="text"
              id="taxonomyInput"
              class="text-input"
              value="Orchidaceae / Epidendroideae / Epidendreae / Laeliinae"
              placeholder="例: Orchidaceae / Epidendroideae / Epidendreae / Laeliinae"
              autocomplete="off"
            >
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="scientificNameInput" class="field-label">
                植物の学名
                <span class="field-note">太字イタリック</span>
              </label>
              <input
                type="text"
                id="scientificNameInput"
                class="text-input font-serif-italic"
                value="Cattleya maxima"
                placeholder="例: Cattleya maxima"
                autocomplete="off"
              >
            </div>

            <div class="field">
              <label for="authorYearInput" class="field-label">
                記載者と記載年
                <span class="field-note">学名の右隣</span>
              </label>
              <input
                type="text"
                id="authorYearInput"
                class="text-input"
                value="Lindl. 1833"
                placeholder="例: Lindl. 1833"
                autocomplete="off"
              >
            </div>
          </div>

          <div class="field">
            <label for="originInput" class="field-label">
              原産国
              <span class="field-note">「Native to : 」が自動で付きます</span>
            </label>
            <input
              type="text"
              id="originInput"
              class="text-input"
              value="Ecuador, Peru"
              placeholder="例: Ecuador, Peru"
              autocomplete="off"
            >
          </div>

          <div class="field">
            <div class="field-label-row">
              <label for="dateInput" class="field-label">
                日付
                <span class="field-note">下部中央</span>
              </label>
              <button type="button" id="todayButton" class="btn btn-text">今日の日付を入力</button>
            </div>
            <input
              type="text"
              id="dateInput"
              class="text-input"
              value="November 20th, 2026"
              placeholder="例: November 20th, 2026"
              autocomplete="off"
            >
          </div>
        </div>

        <!-- 3. デザインテンプレート -->
        <div class="form-section">
          <h2 class="section-heading">3. デザインテンプレート</h2>
          <div class="template-grid" role="radiogroup" aria-label="デザインテンプレートの選択">
            <button type="button" class="template-card is-active" data-template="classic-ivory" aria-pressed="true">
              <span class="template-swatch swatch-ivory" aria-hidden="true"></span>
              <span class="template-name">Classic Ivory</span>
              <span class="template-desc">Times New Roman</span>
            </button>
            <button type="button" class="template-card" data-template="herbarium-dark" aria-pressed="false">
              <span class="template-swatch swatch-dark" aria-hidden="true"></span>
              <span class="template-name">Herbarium Dark</span>
              <span class="template-desc">Times New Roman</span>
            </button>
            <button type="button" class="template-card" data-template="helvetica-ivory" aria-pressed="false">
              <span class="template-swatch swatch-ivory" aria-hidden="true"></span>
              <span class="template-name is-sans">Helvetica Ivory</span>
              <span class="template-desc">Helvetica</span>
            </button>
            <button type="button" class="template-card" data-template="helvetica-dark" aria-pressed="false">
              <span class="template-swatch swatch-dark" aria-hidden="true"></span>
              <span class="template-name is-sans">Helvetica Dark</span>
              <span class="template-desc">Helvetica</span>
            </button>
          </div>

          <label class="logo-toggle">
            <input type="checkbox" id="showLogoCheckbox" checked>
            <span>下部にロゴ（syn.）を表示する</span>
          </label>
        </div>
      </section>

      <!-- プレビュー＆書き出しパネル -->
      <section class="preview-panel" aria-label="完成イメージのプレビュー">
        <div class="preview-stage">
          <div class="canvas-frame">
            <canvas
              id="plateCanvas"
              width="1600"
              height="2000"
              aria-label="生成された植物図鑑プレートのプレビュー"
            ></canvas>
          </div>
          <p class="preview-meta">出力サイズ: 1600 × 2000 px（縦横比 4:5）</p>
        </div>

        <div class="export-bar">
          <button type="button" id="downloadPngButton" class="btn btn-primary">
            PNG画像をダウンロード
          </button>
          <button type="button" id="downloadJpgButton" class="btn btn-secondary">
            JPEG画像をダウンロード
          </button>
        </div>
      </section>
    </main>
  </div>

  <script src="logo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
